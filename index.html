<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <input type="text" id="input" inputmode="none" readonly aria-label="Calculator display" autocomplete="off" spellcheck="false" />
        <div class="numbers">
            <button class="operator" onclick="clearDisplay()" aria-label="Clear">C</button>
            <button class="operator" onclick="deleteLast()" aria-label="Delete last digit">←</button>
            <button class="operator" onclick="setOperator('%')">%</button>
            <button class="operator" onclick="setOperator('÷')">÷</button>
